# 暫時用途：這個開發環境無法連到 npm registry，改由 CI 更新 package-lock.json 並推回分支。
# 依賴更新完成後會在同一個 PR 移除此檔案。
name: Lockfile Sync (temporary)

on:
  push:
    branches: [feature/payslip-import]
    paths: [package.json]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git diff --quiet package-lock.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync package-lock.json for pdfjs-dist" package-lock.json
          git push
