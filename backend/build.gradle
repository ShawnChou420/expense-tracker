plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.expensetracker'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

tasks.register('baselineExisting', JavaExec) {
    group = 'database'
    description = 'Explicitly baseline a reviewed legacy schema at version 1'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.expensetracker.BaselineExisting'
}

// 受控的 SUPER_ADMIN 授權／撤銷工具（只在擁有者自己的電腦上執行，連線資訊用環境變數提供）
// 例如：bash backend/gradlew adminRole --args="grant 12 --reason 初始化擁有者帳號"
tasks.register('adminRole', JavaExec) {
    group = 'database'
    description = 'Grant, revoke or list SUPER_ADMIN by user_seq (asks to confirm the email)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.expensetracker.AdminRoleTool'
    standardInput = System.in
}
