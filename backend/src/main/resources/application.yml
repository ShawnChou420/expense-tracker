spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD:}
    hikari:
      # 小型資料庫方案連線數有限，預設 5 條即可
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    enabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
server:
  # Render 會提供 PORT（預設 10000）；本機沿用 API_PORT，預設 8080
  port: ${PORT:${API_PORT:8080}}
  # 在 Render 反向代理後面時，從 X-Forwarded-* 取得真實來源 IP 與 https（只信任內部代理）
  forward-headers-strategy: native
  servlet:
    session:
      tracking-modes: cookie
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost}
