spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
server:
  port: ${API_PORT:8080}
  servlet:
    session:
      tracking-modes: cookie
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost}
