# Render Blueprint：後端 API（免費方案）。資料庫使用外部的 Neon Postgres（免費方案）。
# 使用方式與注意事項見 backend/DEPLOY_RENDER.md。
# 不要在這個檔案寫入任何密碼、token 或連線字串。

services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    # backend/gradlew 會呼叫 android/gradlew，所以建置 context 是專案根目錄
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    # 免費方案：閒置 15 分鐘會休眠，下一次請求要等它喚醒（約 1 分鐘）。
    # 使用者變多、不想等待時改成付費的 0.5c-512mb（不休眠），資料庫不受影響。
    plan: free
    branch: main
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # 只有後端相關檔案變動才重新部署，前端修改不會觸發
    buildFilter:
      paths:
        - backend/**
        - android/gradlew
        - android/gradle/wrapper/**
        - render.yaml
      ignoredPaths:
        - backend/**/*.md
    envVars:
      # Neon 的連線字串（postgresql://...），建立時由你在 Render 後台貼上，不要寫進這個檔案
      # 程式啟動時會轉成 JDBC 設定（見 DatabaseUrl.java）
      - key: DATABASE_URL
        sync: false
      # 允許呼叫 API 的前端來源，建立時由你在 Render 後台輸入
      # Android（Capacitor）App 為 https://localhost
      - key: CORS_ORIGINS
        sync: false

# 原本的 Render 付費 Postgres（0.1c-256mb，約 US$10.50/月，含時間點還原）。
# 使用者變多、需要更完整的備份時，可以改回 Render Postgres，再把資料從 Neon 搬過來。
